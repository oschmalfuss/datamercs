<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Metadata RACI — Who Signs, Who Drives</title>
  <desc id="desc">RACI matrix for metadata governance. Owner accountable, steward responsible, custodian technical, council cross-domain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="100%" stop-color="#10131c"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, Helvetica, Arial, sans-serif; }
      .title { fill: #e8eef7; font-size: 36px; font-weight: 800; letter-spacing: 1px; }
      .sub { fill: #9aa3b5; font-size: 16px; font-weight: 500; }
      .th { fill: #c5cde0; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .act { fill: #d7deea; font-size: 16px; font-weight: 500; }
      .A { fill: #3ee0ff; font-size: 22px; font-weight: 800; }
      .R { fill: #f0b429; font-size: 22px; font-weight: 800; }
      .C { fill: #b48cff; font-size: 22px; font-weight: 800; }
      .I { fill: #6b7386; font-size: 22px; font-weight: 800; }
      .leg { fill: #b7c0d0; font-size: 14px; }
      .foot { fill: #8b93a7; font-size: 13px; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="780" fill="#3ee0ff"/>
  <rect x="1194" y="0" width="6" height="780" fill="#c44cff"/>

  <text class="t title" x="600" y="58" text-anchor="middle">METADATA RACI — WHO SIGNS, WHO DRIVES</text>
  <text class="t sub" x="600" y="88" text-anchor="middle">Owner · Steward · Custodian · Council</text>

  <!-- header bar -->
  <rect x="56" y="118" width="1088" height="48" fill="#161b27" stroke="#2a3144"/>
  <text class="t th" x="180" y="148" text-anchor="middle">ACTIVITY</text>
  <text class="t th" x="520" y="148" text-anchor="middle">OWNER</text>
  <text class="t th" x="700" y="148" text-anchor="middle">STEWARD</text>
  <text class="t th" x="880" y="148" text-anchor="middle">CUSTODIAN</text>
  <text class="t th" x="1060" y="148" text-anchor="middle">COUNCIL</text>

  <!-- rows -->
  <g id="rows">
    <!-- y starts 166, row h 58 -->
    <rect x="56" y="166" width="1088" height="58" fill="#0e121b" stroke="#232a3b"/>
    <rect x="56" y="224" width="1088" height="58" fill="#121722" stroke="#232a3b"/>
    <rect x="56" y="282" width="1088" height="58" fill="#0e121b" stroke="#232a3b"/>
    <rect x="56" y="340" width="1088" height="58" fill="#121722" stroke="#232a3b"/>
    <rect x="56" y="398" width="1088" height="58" fill="#0e121b" stroke="#232a3b"/>
    <rect x="56" y="456" width="1088" height="58" fill="#121722" stroke="#232a3b"/>
    <rect x="56" y="514" width="1088" height="58" fill="#0e121b" stroke="#232a3b"/>
    <rect x="56" y="572" width="1088" height="58" fill="#121722" stroke="#232a3b"/>
  </g>

  <g class="t act">
    <text x="76" y="202">Define field meaning</text>
    <text x="76" y="260">Set the quality bar</text>
    <text x="76" y="318">Approve access / redistribution</text>
    <text x="76" y="376">Maintain mappings and rules</text>
    <text x="76" y="434">Monitor feed quality</text>
    <text x="76" y="492">Implement storage and controls</text>
    <text x="76" y="550">Accept a known-bad shipment</text>
    <text x="76" y="608">Encode AI provenance</text>
  </g>

  <!-- letters: Owner, Steward, Custodian, Council -->
  <g text-anchor="middle">
    <text class="t A" x="520" y="204">A</text><text class="t R" x="700" y="204">R</text><text class="t C" x="880" y="204">C</text><text class="t I" x="1060" y="204">I</text>
    <text class="t A" x="520" y="262">A</text><text class="t R" x="700" y="262">R</text><text class="t C" x="880" y="262">C</text><text class="t I" x="1060" y="262">I</text>
    <text class="t A" x="520" y="320">A</text><text class="t C" x="700" y="320">C</text><text class="t R" x="880" y="320">R</text><text class="t I" x="1060" y="320">I</text>
    <text class="t C" x="520" y="378">C</text><text class="t R" x="700" y="378">R</text><text class="t C" x="880" y="378">C</text><text class="t I" x="1060" y="378">I</text>
    <text class="t I" x="520" y="436">I</text><text class="t R" x="700" y="436">R</text><text class="t C" x="880" y="436">C</text><text class="t I" x="1060" y="436">I</text>
    <text class="t I" x="520" y="494">I</text><text class="t C" x="700" y="494">C</text><text class="t R" x="880" y="494">R</text><text class="t I" x="1060" y="494">I</text>
    <text class="t A" x="520" y="552">A</text><text class="t R" x="700" y="552">R</text><text class="t I" x="880" y="552">I</text><text class="t I" x="1060" y="552">I</text>
    <text class="t A" x="520" y="610">A</text><text class="t R" x="700" y="610">R</text><text class="t C" x="880" y="610">C</text><text class="t C" x="1060" y="610">C</text>
  </g>

  <text class="t leg" x="600" y="678" text-anchor="middle">
    <tspan fill="#3ee0ff" font-weight="800">A</tspan> Accountable
    <tspan dx="18" fill="#f0b429" font-weight="800">R</tspan> Responsible
    <tspan dx="18" fill="#b48cff" font-weight="800">C</tspan> Consulted
    <tspan dx="18" fill="#6b7386" font-weight="800">I</tspan> Informed
  </text>
  <line x1="360" y1="708" x2="520" y2="708" stroke="#3ee0ff" stroke-width="2"/>
  <line x1="680" y1="708" x2="840" y2="708" stroke="#c44cff" stroke-width="2"/>
  <text class="t foot" x="600" y="742" text-anchor="middle">datamercs.net · DAMA-aligned operating model</text>
</svg>
