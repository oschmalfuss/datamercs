favicon: logo.png
description: |
  Metadata consulting and teaching for scholarly publishing and libraries.
output_dir: "_site"
exclude: ["README.md", "build.R", "face", "OSDS-site.Rproj"]
base_url: https://www.datamercs.net
theme: theme.css
navbar:
  right:
    - text: "Home"
      href: index.html
    - text: "Services"
      href: about.html#services
    - text: "About"
      href: about.html
    - text: "Insights"
      href: insights.html
    - text: "Resources"
      href: resources.html
    - text: "Contact"
      href: contact.html
    - icon: fa fa-github
      href: https://github.com/oschmalfuss
    - text: "X"
      icon: fab fa-x-twitter
      href: https://x.com/DataMercsDotNet
    - icon: fa fa-linkedin
      href: https://www.linkedin.com/in/olaf-schmalfu%C3%9F
    - icon: fa fa-rss
      href: index.xml
collections:
  posts:
    categories: true
    categories_metadata: true
    share: [twitter, linkedin, instagram, facebook]
output: distill::distill_article
